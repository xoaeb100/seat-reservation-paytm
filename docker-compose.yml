services:
  postgres:
    image: postgres:16-alpine
    container_name: seat-reservation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: seat-reservation-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: seat_reservation
      DB_USER: postgres
      DB_PASSWORD: postgres
      ADMIN_TOKEN: dev-admin-token

    ports:
      - "3000:3000"

volumes:
  postgres_data: